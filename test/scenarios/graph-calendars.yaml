name: graph-calendars
description: >
  An Office 365 account has no CalDAV, so its calendars come from Microsoft Graph with their
  own calendar-scoped token. That works for an account signed in before Graph sending, which
  granted the calendar scopes but not the mail ones. Every calendar /me/calendars lists,
  across pages, becomes a read-only Calendar row (until event edits go through Graph) with
  its colour and whether the account owns it. A calendar renamed on the server is renamed
  here; one the server stops listing is removed.
source: "https://learn.microsoft.com/en-us/graph/api/user-list-calendars (calendar: id, name, hexColor, canEdit, owner)"
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars_page_size: 1
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, hexColor: "#FF8C00", canEdit: true,
         owner: {name: Harness Test, address: Test@Example.test}}
      - {id: "AAMkADTeam=", name: Team, hexColor: "", canEdit: false,
         owner: {name: Bob Builder, address: bob@example.net}}
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft calendar sync complete: 2 calendars", timeout: 90}
  - assert:
      calendars:
        Calendar: {path: "AAMkADefault=", color: "#ff8c00", read_only: true, owner: mine}
        Team: {path: "AAMkADTeam=", read_only: true, owner: other}
  - server.graph_calendars:
      calendars:
        - {id: "AAMkADefault=", name: Work, hexColor: "#FF8C00", canEdit: true,
           owner: {name: Harness Test, address: test@example.test}}
  - client.sync_calendar: {}
  - wait: {log: "Microsoft calendar sync complete: 1 calendars", timeout: 60}
expect:
  calendars:
    Work: {path: "AAMkADefault=", color: "#ff8c00", read_only: true, owner: mine}
  log_present: ["Removed calendar 'Team' and its 0 events"]
  graph: {graph_mail_token_requests: 0}
  running: true
