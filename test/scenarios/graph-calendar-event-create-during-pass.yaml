name: graph-calendar-event-create-during-pass
description: >
  A new event is created while a calendar pass lists the calendar's events. Graph answers the
  listing as it stood before the create, and the create stores Graph's copy before the listing
  arrives. The pass read the calendar's rows before asking, so the new event's row isn't among
  those it compares with the listing, and it stays.
source: "MicrosoftCalendarWorker: writes run on the foreground thread and don't take the pass mutex"
env:
  CALENDAR_SYNC_NOW: 1791936000 # 2026-10-14T00:00Z
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, isDefaultCalendar: true, owner: {name: Harness Test, address: test@example.test}}
    graph_events:
      AAMkADefault=: []
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft calendar sync complete: 1 calendars", timeout: 90}
  - server.graph_events_delay: {seconds: 4}
  - client.sync_calendar: {}
  - wait: {seconds: 1}
  - client.task:
      __cls: SyncbackEventTask
      calendar_of: Calendar
      event:
        icsuid: "new-event@mailspring"
        ics: "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:new-event@mailspring\r\nSUMMARY:Design review\r\nDTSTART;TZID=America/Chicago:20261021T140000\r\nDTEND;TZID=America/Chicago:20261021T150000\r\nDTSTAMP:20261013T120000Z\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n"
    as: create
  - wait: {task: create, timeout: 60}
  - wait: {seconds: 5}
  - server.graph_events_delay: {seconds: 0}
expect:
  task_error: {create: null}
  events:
    "uid-created-1|":
      href: "AAMkEvCreated1="
  log_count: {"Microsoft calendar sync complete": 2}
  running: true
