name: mark-read-fans-out-to-all-placements
description: >
  A three-message thread whose every message has a copy in INBOX and in Sent (the user's
  own replies, saved by the client and delivered back). Marking the thread unread and then
  read again (ChangeUnreadTask with threadIds, as the client sends it) must change \Seen on
  every placement of every message - both copies, in both folders, on the server - and the
  database must agree after each task and stay put afterwards. The task addresses the
  thread; the engine expands it to messages and then to placements (performRemoteChangeOnMessages).
source: "docs/message-placements-plan.md 2.3 (flags per placement; flag tasks address every placement); TaskProcessor::performRemoteChangeOnMessages (isMove=false: every live placement); TaskProcessor::inflateMessages (threadIds)"
servers:
  - {fake: dovecot}
  - {fake: plain}
  - {dovecot: qresync}
mailboxes:
  INBOX: {messages: 6}
  Sent: {messages: 2}
setup:
  - server.append: {mailbox: INBOX, messages: {count: 1, thread: 2}}
  - server.duplicate: {mailbox: INBOX, uids: "7:9", to: Sent}
steps:
  - wait: quiescent
  - assert:
      counts: {INBOX: 9, Sent: 5}
      db_matches_server: {}
  - client.task: {__cls: ChangeUnreadTask, threads: {mailbox: INBOX, uids: [7]}, unread: true}
    as: unread
  - wait: {task: unread, timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
  - assert:
      db_matches_server: {flags: true}
  - client.task: {__cls: ChangeUnreadTask, threads: {mailbox: INBOX, uids: [7]}, unread: false}
    as: read
  - wait: {task: read, timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
expect:
  db_matches_server: {flags: true}
  counts: {INBOX: 9, Sent: 5}
  stable: {passes: 2}
  running: true
