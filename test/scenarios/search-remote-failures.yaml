name: search-remote-failures
description: >
  How `search-remote` behaves when things go wrong. A folder whose SEARCH the server refuses
  is reported in `errors` and the other folders are still searched. A connection dropped
  under a SEARCH is reopened once and the search completes. A newer request supersedes one
  still in flight: the older search stops at the next folder and never reports `done`. A
  connection idle past SEARCH_IDLE_DISCONNECT is closed and reopened by the next search. A
  server that drops the reconnect too fails the whole search with the connection error.
  `search-remote-cancel` stops only the search it names, and a request without a searchId
  is ignored. A term holding CR or LF, or a header name outside RFC 5322's field-name, fails
  the request before anything is sent: libetpan writes ASCII terms as quoted strings and
  escapes only `"` and `\`, so a CR LF inside one would end the SEARCH line and run whatever
  follows as a second command. A searchId that is not a string is ignored like a missing
  one, and the process stays up. A cancel that lands during the last folder's SEARCH still
  keeps the search from reporting done, as does an error after the cancel.
source: "MailSync/SearchWorker.cpp"
servers:
  - {fake: dovecot}
env:
  SEARCH_IDLE_DISCONNECT: "3"
setup:
  - server.append: {mailbox: INBOX, messages: {subject: Inbox pineapple, message_id: "<inbox@search.test>"}}
  - server.append: {mailbox: Archive, messages: {subject: Archived pineapple, message_id: "<archive@search.test>"}}
steps:
  - wait: quiescent
  - server.reject: {at: {hook: before_command, command: "^UID SEARCH", mailbox: INBOX}, code: CANNOT, text: "Search failed"}
  - client.search: {criteria: [subject, pineapple]}
    as: refused
  - server.drop_connections: {at: {hook: before_command, command: "^UID SEARCH"}}
  - client.search: {criteria: [subject, pineapple]}
    as: dropped
  - server.pause: {at: {hook: before_command, command: "^UID SEARCH", mailbox: INBOX, delay: 3}}
  - client.search: {criteria: [subject, pineapple], wait: false}
    as: superseded
  - wait: {seconds: 1}
  - client.search: {criteria: [subject, archived]}
    as: newer
  - wait: {seconds: 4}
  - wait: {log: "Search connection idle, disconnecting", timeout: 15}
  - wait: {seconds: 7}
  - client.search: {criteria: [subject, inbox]}
    as: after_idle
  - server.pause: {at: {hook: before_command, command: "^UID SEARCH", mailbox: INBOX, delay: 3}}
  - client.search: {criteria: [subject, pineapple], wait: false}
    as: cancelled
  - wait: {seconds: 1}
  - client.search_cancel: {of: cancelled}
  - wait: {seconds: 8}
  - server.pause: {at: {hook: before_command, command: "^UID SEARCH", mailbox: INBOX, delay: 2}}
  - client.search: {criteria: [subject, pineapple], wait: false}
    as: stale_cancel
  - client.search_cancel: {searchId: some-earlier-search}
  - client.search_without_id: {}
  - wait: {seconds: 6}
  - server.pause: {at: {hook: before_command, command: "^UID SEARCH", mailbox: INBOX, delay: 2}}
  - client.search: {criteria: [subject, pineapple], wait: false}
    as: running
  - wait: {seconds: 0.5}
  - client.search: {criteria: [subject, archived], wait: false}
    as: queued
  - client.search_cancel: {of: queued}
  - wait: {seconds: 6}
  - client.search: {criteria: [subject, "pineapple\r\nA999 DELETE Archive"]}
    as: crlf_term
  - client.search: {criteria: [header, "X-Mailer\r\nA998 DELETE Archive", harness]}
    as: crlf_header_name
  - client.search: {criteria: [subject, "pineapple\rA996 DELETE Archive"]}
    as: cr_term
  - client.search: {criteria: [subject, "pine\x7Fapple"]}
    as: del_term
  - client.search: {criteria: [header, "X Mailer", harness]}
    as: space_header_name
  - client.search: {criteria: [header, "X-Mailer:", harness]}
    as: colon_header_name
  - client.search: {criteria: [header, "", harness]}
    as: empty_header_name
  - client.search: {criteria: [header, "X-Mail\u00E9r", harness]}
    as: utf8_header_name
  - client.send: {type: search-remote, searchId: 123, criteria: [all]}
  - client.send: {type: search-remote, searchId: null, criteria: [all]}
  - client.send: {type: search-remote-cancel, searchId: 123}
  - client.search: {criteria: [subject, archived]}
    as: after_bad_ids
  - server.pause: {at: {hook: before_command, command: "^UID SEARCH", mailbox: Archive, delay: 3}}
  - client.search: {criteria: [subject, pineapple], folders: [Archive], wait: false}
    as: cancelled_last_folder
  - wait: {seconds: 1}
  - client.search_cancel: {of: cancelled_last_folder}
  - wait: {seconds: 8}
  - server.pause: {at: {hook: before_command, command: "^UID SEARCH", mailbox: Archive, delay: 3}}
  - server.drop_connections: {at: {hook: before_command, command: "^UID SEARCH", mailbox: Archive, every: true}}
  - client.search: {criteria: [subject, pineapple], folders: [Archive], wait: false}
    as: cancelled_then_error
  - wait: {seconds: 1}
  - client.search_cancel: {of: cancelled_then_error}
  - wait: {seconds: 8}
  - server.drop_connections: {at: {hook: before_command, command: "^UID SEARCH", every: true}}
  - client.search: {criteria: [subject, pineapple]}
    as: server_down
  - wait: {seconds: 7}
expect:
  search:
    refused: {message_ids: ["<archive@search.test>"], folder_errors: 1}
    dropped: {message_ids: ["<inbox@search.test>", "<archive@search.test>"], folder_errors: 0}
    newer: {message_ids: ["<archive@search.test>"]}
    after_idle: {message_ids: ["<inbox@search.test>"]}
    server_down: {error: ErrorConnection}
    stale_cancel: {message_ids: ["<inbox@search.test>", "<archive@search.test>"]}
    crlf_term: {error: "search term holds a control character"}
    crlf_header_name: {error: "search header name is not an RFC 5322 field name"}
    cr_term: {error: "search term holds a control character"}
    del_term: {error: "search term holds a control character"}
    space_header_name: {error: "search header name is not an RFC 5322 field name"}
    colon_header_name: {error: "search header name is not an RFC 5322 field name"}
    empty_header_name: {error: "search header name is not an RFC 5322 field name"}
    utf8_header_name: {error: "search header name is not an RFC 5322 field name"}
    after_bad_ids: {message_ids: ["<archive@search.test>"]}
  server_has:
    Archive: ["<archive@search.test>"]
  search_not_done: [superseded, cancelled, running, queued, cancelled_last_folder, cancelled_then_error]
  no_search_without_id: {}
  log_count:
    'Search connection idle, disconnecting': 5
  running: true
