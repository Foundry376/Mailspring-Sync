name: rules-ready-self-addressed-send
description: >
  Mail the user sends to someone else never gets rulesReady. Mail the user sends to
  themself gets it once, when its INBOX copy is recorded, even when the MTA delivers that
  copy long after the send path has recorded the Sent copy and stored the body: here
  delivery is held until the send task has finished and a full pass has run. Nothing is
  emitted at send time, when the only copy is in Sent (on Cyrus the rule's Move found no
  copy to move: [PLT7-R-move-1]).
source: "client docs/tasks/mail-rules-once-per-incoming-message.md, bug B2 of the 2026-09-26 client verification pass (Cyrus)"
servers:
  - {fake: dovecot, smtp: true}
  - {fake: plain, smtp: true}
  - {dovecot: qresync, smtp: true}
  - {cyrus: fastmail, smtp: true}
mailboxes:
  INBOX: {messages: 2}
steps:
  - wait: quiescent
  - client.task:
      __cls: SendDraftTask
      draft:
        hMsgId: "rr-out-1@example.test"
        subject: "Rules ready: to Bob"
        body: "<p>Hi Bob</p>"
        plaintext: false
        from: [{name: "Harness Test", email: "test@example.test"}]
        to: [{name: "Bob Builder", email: "bob@example.net"}]
        cc: []
        bcc: []
        replyTo: []
        files: []
        rthMsgId: ""
        fwdMsgId: ""
      perRecipientBodies: null
    as: out
  - wait: {task: out, timeout: 60}
  - server.smtp_hold: {}
  - client.task:
      __cls: SendDraftTask
      draft:
        hMsgId: "rr-self-1@example.test"
        subject: "Rules ready: note to self"
        body: "<p>Remember the milk</p>"
        plaintext: false
        from: [{name: "Harness Test", email: "test@example.test"}]
        to: [{name: "Harness Test", email: "test@example.test"}]
        cc: []
        bcc: []
        replyTo: []
        files: []
        rthMsgId: ""
        fwdMsgId: ""
      perRecipientBodies: null
    as: self
  - wait: {task: self, timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
  - assert:
      counts: {INBOX: 2, Sent: 2}
      rules_ready: {total: 2, messages: {"rr-out-1@example.test": 0, "rr-self-1@example.test": 0}}
  - server.smtp_release: {}
  - wait: {counts: {INBOX: 3}}
  - wait: {quiescent: true}
  - sync: pass
expect:
  smtp: {count: 2}
  rules_ready:
    total: 3
    messages:
      "rr-out-1@example.test": 0
      "rr-self-1@example.test": {count: 1, folders: [INBOX, Sent], body: false}
  counts: {INBOX: 3, Sent: 2}
  db_matches_server: {}
  stable: {passes: 1}
  running: true
