name: uidvalidity-change
description: >
  The server rebuilds a mailbox and hands out a new UIDVALIDITY. Every local message in that
  folder must be re-mapped to its new UID (fake) or kept at its old UID under the new
  validity (Dovecot, where doveadm changes the value without renumbering) without loss.
source: SyncWorker.cpp UIDVALIDITY handling; PR #140 (truncated rebuild re-loop)
servers:
  - {fake: dovecot}
  - {fake: plain}
  - {dovecot: qresync}
mailboxes:
  INBOX: {messages: 80}
  Archive: {messages: 10}
steps:
  - wait: quiescent
  - server.set_uidvalidity: {mailbox: INBOX, value: 987654}
  - sync: pass
  - sync: pass
expect:
  # Dovecot disconnects the idling session when the mailbox's UIDVALIDITY changes, and the
  # engine then segfaults in mailcore takeVanishedMessages (idleCycleIteration) - the same
  # accumulator that crashes in connection-dropped-during-idle. Seen 2026-09-19.
  running: {xfail: {dovecot: "SIGSEGV in IMAPSession::takeVanishedMessages after Dovecot drops the session on UIDVALIDITY change"}}
  db_matches_server: {xfail: {dovecot: "same crash"}}
  counts: {INBOX: 80, Archive: 10, xfail: {dovecot: "same crash"}}
  stable: {passes: 1, xfail: {dovecot: "same crash"}}
