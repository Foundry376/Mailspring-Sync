name: search-remote-fetch-sizing-refused
description: >
  The server refuses a folder's RFC822.SIZE fetch with NO. That folder's candidates are
  skipped, the folder is recorded in `errors`, and the search still finishes with the other
  folder's candidates fetched.
source: "MailSync/SearchWorker.cpp (fetchCandidates)"
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: {count: 3, age_days: 120}}
  Archive: {messages: {count: 2, age_days: 120}}
steps:
  - wait: quiescent
  - server.reject: {at: {hook: before_command, command: "^UID FETCH [0-9:,]+ \\(UID RFC822\\.SIZE\\)", mailbox: INBOX}, code: SERVERBUG, text: "Fetch failed"}
  - client.search: {criteria: [subject, Message], fetchLimit: 100}
    as: fetch
  - wait: {log: 'Search search-\S+: fetched 2 message\(s\) .* 2 of 5 stored', timeout: 30}
expect:
  search:
    fetch: {candidates: 5, fetched: 2, skipped: 3, phase: done, folder_errors: 1}
  log_present:
    - 'Search search-\S+: sizing INBOX failed: ErrorFetch, skipping its 3 candidate\(s\)'
  running: true
