name: search-remote-fetch-dropped
description: >
  The connection drops during the candidate fetch. The search reconnects once, through
  SearchWorker::connect, and fetches the batch again; every candidate is stored.
source: "MailSync/SearchWorker.cpp (fetchCandidates)"
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: {count: 3, age_days: 120}}
steps:
  - wait: quiescent
  - server.drop_connections: {at: before_fetch_body}
  - client.search: {criteria: [subject, Message], fetchLimit: 100}
    as: fetch
  - wait: {log: 'Search search-\S+: fetched 3 message\(s\) .* 3 of 3 stored', timeout: 30}
expect:
  search:
    fetch: {candidates: 3, fetched: 3, skipped: 0, phase: done, folder_errors: 0}
  log_present:
    - 'Search search-\S+: connection lost fetching from INBOX, reconnecting'
  local_search:
    '"body of message 3"': [Message 3]
  running: true
