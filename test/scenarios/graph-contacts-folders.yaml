name: graph-contacts-folders
description: >
  Another client moves a contact between folders (Graph has no move for contacts, Outlook does):
  the old folder's delta reports it removed and the new one's reports it changed, in whichever
  order the engine reads the folders, so removals wait until every folder is read and apply only
  to a row still in the folder that reported it. Both moved contacts keep their rows, ids and
  metadata, now in their new folder. A folder deleted with its contacts takes their rows with it.
source: "contact-delta reports per folder (https://learn.microsoft.com/en-us/graph/api/contact-delta); no /move for contacts (400 RequestBroker--ParseUri, Office 365 and Outlook.com, 2026-11-11)"
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_contact_folders:
      - {id: "AAMkAG/Friends=", displayName: Friends}
      - {id: "AAMkAG/Work=", displayName: Work}
    graph_contacts:
      - {id: "AAkALg/grace+Contact=", givenName: Grace, surname: Hopper}
      - {id: "AAkALg/alan+Contact=", parentFolderId: "AAMkAG/Friends=", givenName: Alan, surname: Turing}
      - {id: "AAkALg/bob+Contact=", parentFolderId: "AAMkAG/Work=", givenName: Bob, surname: Boss}
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft contact sync complete: 3 folders", timeout: 90}
  - server.graph_contact: {contact: {id: "AAkALg/grace+Contact=", parentFolderId: "AAMkAG/Friends="}}
  - server.graph_contact: {contact: {id: "AAkALg/alan+Contact=", parentFolderId: "AAMkAG/Contacts="}}
  - server.graph_contact_folders: {folders: [{id: "AAMkAG/Friends=", displayName: Friends}]}
  - restart: {}
  - wait: {log: "Microsoft contact sync complete", count: 2, timeout: 90}
  - wait: {seconds: 2}
expect:
  contacts:
    graph_count: 2
    graph:
      "AAkALg/grace+Contact=": {name: Grace Hopper, info: {parentFolderId: "AAMkAG/Friends="}}
      "AAkALg/alan+Contact=": {name: Alan Turing, info: {parentFolderId: "AAMkAG/Contacts="}}
      "AAkALg/bob+Contact=": null
  log_count: {"Microsoft contact sync complete: 2 folders, 1 contacts removed": 1}
  deltas:
    Contact: {persist: 2, unpersist: 1}
  running: true
