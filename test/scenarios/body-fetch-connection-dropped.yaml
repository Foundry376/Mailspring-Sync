name: body-fetch-connection-dropped
description: >
  The connection drops while the engine fetches a batch of message bodies. The bodies it
  reserved for that batch and had not requested yet must be fetched by a later pass; only a
  body in flight keeps its empty MessageBody row, like any other failed fetch. A body left
  reserved is never fetched or indexed for search unless the user opens the message.
source: SyncWorker::syncReservedMessageBodies; batches of never-fetched bodies after ErrorConnection in a dev database
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: 40}
setup:
  - server.drop_connections: {at: {hook: before_command, command: "UID FETCH \\d+ BODY\\.PEEK\\[\\]"}}
steps:
  # The worker that failed retries after its 120 s sleep.
  - wait: {quiescent: true, timeout: 200}
expect:
  unfetched_bodies: {max: 2}    # one in flight per worker
  log_present: ["Released \\d+ body fetches"]
  db_matches_server: {}
  counts: {INBOX: 40}
  running: true
