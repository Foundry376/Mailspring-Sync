name: graph-calendars-refresh-requested-during-pass
description: >
  The client asks for a calendar refresh after every event write, and the pass already running
  may have listed the calendar before that write. A request that arrives during a refresh runs
  one more pass after it rather than being dropped. Here the second request arrives while the
  first refresh's slow listing is out: two refreshes and the periodic pass make three passes.
source: "iCloud manual test: a write's refresh dropped while a pass was running, reverting the event"
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars_delay: 10
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, owner: {name: Harness Test, address: test@example.test}}
mailboxes:
  INBOX: {messages: 1}
steps:
  - client.sync_calendar: {}
  - client.sync_calendar: {}
  - wait: {log: "Microsoft calendar sync complete", count: 3, timeout: 90}
  - wait: {seconds: 15}
expect:
  log_count: {"Microsoft calendar sync complete": 3}
  log_absent: ["Stopping cal/contacts sync"]
  running: true
