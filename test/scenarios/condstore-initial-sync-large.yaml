name: condstore-initial-sync-large
description: >
  A 2500-message INBOX on a CONDSTORE+QRESYNC server. Initial sync walks the UID space in
  chunks; every message must arrive, because on this branch nothing ever re-scans a gap.
source: Mailspring-Sync PR #140 (1774 of 2500 synced before the fix)
servers:
  - {fake: dovecot}
  - {dovecot: qresync}
mailboxes:
  INBOX: {messages: {count: 2500, age_days: 30}}
steps:
  - wait: {quiescent: true, timeout: 600}
expect:
  db_matches_server: {}
  counts: {INBOX: 2500}
  folder_status: {INBOX: {syncedMinUID: 1, busy: false}}
  running: true
