name: search-remote-fetch-dropped-sizing
description: >
  The connection drops on the sizing fetch that precedes the bodies. The search reconnects
  once, sizes again and fetches every candidate.
source: "MailSync/SearchWorker.cpp (fetchCandidates)"
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: {count: 3, age_days: 120}}
steps:
  - wait: quiescent
  - server.drop_connections: {at: {hook: before_command, command: "^UID FETCH [0-9:,]+ \\(UID RFC822\\.SIZE\\)"}}
  - client.search: {criteria: [subject, Message], fetchLimit: 100}
    as: fetch
  - wait: {log: 'Search search-\S+: fetched 3 message\(s\) .* 3 of 3 stored', timeout: 30}
expect:
  search:
    fetch: {candidates: 3, fetched: 3, skipped: 0, phase: done, folder_errors: 0}
  log_count:
    'Search search-\S+: connection lost sizing INBOX, reconnecting': 1
    'sent \d+ UID FETCH [0-9:,]+ \(UID RFC822\.SIZE\)': 2
  running: true
