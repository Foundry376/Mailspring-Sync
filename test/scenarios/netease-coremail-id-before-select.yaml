name: netease-coremail-id-before-select
description: >
  NetEase and other Coremail hosts refuse SELECT with "Unsafe Login" until the client
  identifies itself with ID, and their STATUS omits UIDNEXT. The engine recognises Coremail
  by its greeting and the missing UIDNEXT by the STATUS reply, so this runs on 127.0.0.1:
  a custom-domain Coremail host must work the same as imap.163.com. This is the NetEase
  handling from PR #121 (aixia715), generalised to Coremail.
source: Mailspring-Sync PR #121; community.getmailspring.com/t/562; offlineimap #696; nextcloud/mail #10679
servers:
  - {fake: netease-coremail}
mailboxes:
  INBOX: {messages: 12}
steps:
  - wait: quiescent
  - server.append: {mailbox: INBOX, messages: 2}
  - sync: pass
expect:
  db_matches_server: {}
  counts: {INBOX: 14}
  log_absent: ["Unsafe Login"]
  running: true
