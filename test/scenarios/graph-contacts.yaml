name: graph-contacts
description: >
  An Office 365 account's contacts sync through Graph into one `graph` ContactBook: the default
  folder and the folder inside it, each through its own delta round, followed across pages. A
  row's info is the Graph contact as the engine selects it (no @odata keys), its etag the
  changeKey, its name Graph's displayName and its email the first address. On the next launch,
  after another client renamed one contact, deleted one and added one to the subfolder, the delta
  links bring only those changes, and the other rows are not written again.
source: "contact-delta (https://learn.microsoft.com/en-us/graph/api/contact-delta); delta paging and @removed observed on an Office 365 tenant and an Outlook.com account, 2026-11-11"
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_contacts_page_size: 2
    graph_contact_folders:
      - {id: "AAMkAG/Friends=", displayName: Friends}
    graph_contacts:
      - id: "AAkALg/ada+Contact="
        title: "Dr."
        givenName: Ada
        surname: Lovelace
        emailAddresses: [{name: Ada Lovelace, address: ada@example.com}, {name: Ada (work), address: ada.work@example.org}]
        mobilePhone: "+1 555 0102"
        companyName: Analytical Engines
        homeAddress: {street: 1 St James Sq, city: London, countryOrRegion: UK, postalCode: SW1}
        birthday: "1815-12-10T00:00:00Z"
        personalNotes: "First programmer.\nLine two."
      - id: "AAkALg/grace+Contact="
        givenName: Grace
        surname: Hopper
        emailAddresses: [{name: Grace Hopper, address: grace@example.com}]
      - id: "AAkALg/plumber+Contact="
        displayName: Plumber
        mobilePhone: "+1 555 0199"
      - id: "AAkALg/alan+Contact="
        parentFolderId: "AAMkAG/Friends="
        givenName: Alan
        surname: Turing
        emailAddresses: [{address: alan@example.com}]
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft contact sync complete", timeout: 90}
  - server.graph_contact: {contact: {id: "AAkALg/grace+Contact=", givenName: Grace B.}}
  - server.graph_contact_delete: {id: "AAkALg/plumber+Contact="}
  - server.graph_contact: {contact: {parentFolderId: "AAMkAG/Friends=", givenName: Edsger, surname: Dijkstra,
                                     emailAddresses: [{address: edsger@example.com}]}}
  - restart: {}
  - wait: {log: "Microsoft contact sync complete", count: 2, timeout: 90}
  - wait: {seconds: 2}
expect:
  contacts:
    books: {graph: 1}
    graph_count: 4
    graph:
      "AAkALg/ada+Contact=":
        name: Dr. Ada Lovelace
        email: ada@example.com
        hidden: false
        info:
          id: "AAkALg/ada+Contact="
          parentFolderId: "AAMkAG/Contacts="
          birthday: "1815-12-10T11:59:00Z"
          personalNotes: "First programmer.\nLine two."
          homeAddress: {street: 1 St James Sq, city: London, countryOrRegion: UK, postalCode: SW1}
          "@odata.etag": null
      "AAkALg/grace+Contact=": {name: Grace B. Hopper, email: grace@example.com}
      "AAkALg/plumber+Contact=": null
      "AAkALg/alan+Contact=": {name: Alan Turing, email: alan@example.com, info: {parentFolderId: "AAMkAG/Friends="}}
      "AAkALg/1+Contact=": {name: Edsger Dijkstra, email: edsger@example.com}
  graph:
    graph_contact_token_requests: 2
    requests:
      "/contactFolders/.*/contacts/delta": 5
  deltas:
    Contact: {persist: 2, unpersist: 1}
  running: true
