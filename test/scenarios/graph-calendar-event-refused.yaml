name: graph-calendar-event-refused
description: >
  An edit that doesn't reach Graph leaves the rows as Graph holds them, not as the client edited
  them: one Graph refuses with a 400, one that would bring back a cancelled occurrence (Graph has
  no way to), and new notes on an online meeting, whose text would replace the HTML body and the
  join details in it. Each fails with its own key. The online meeting's title can still change.
  A new event Graph refuses goes from the calendar, since no pass removes a row Graph never held.
source: "https://learn.microsoft.com/en-us/graph/api/event-update (body property and online meetings)"
env:
  CALENDAR_SYNC_NOW: 1791936000 # 2026-10-14T00:00Z
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, isDefaultCalendar: true, owner: {name: Harness Test, address: test@example.test}}
    graph_failures:
      - {route: "^calendars/AAMkADefault=/events/AAMkEvPlanning=$", method: PATCH, status: 400, code: ErrorInvalidRequest, times: 1}
    graph_events:
      AAMkADefault=:
        - id: "AAMkEvPlanning="
          changeKey: "ck-planning-1"
          iCalUId: "uid-planning"
          type: singleInstance
          subject: Planning
          start: {dateTime: "2026-10-22T09:00:00.0000000", timeZone: Pacific Standard Time}
          end: {dateTime: "2026-10-22T09:30:00.0000000", timeZone: Pacific Standard Time}
          originalStartTimeZone: Pacific Standard Time
          isAllDay: false
          lastModifiedDateTime: "2026-10-01T12:00:00Z"
        - id: "AAMkEvSync="
          changeKey: "ck-sync-1"
          iCalUId: "uid-sync"
          type: singleInstance
          subject: Weekly sync
          body: {contentType: text, content: "Join the meeting"}
          isOnlineMeeting: true
          start: {dateTime: "2026-10-23T09:00:00.0000000", timeZone: Pacific Standard Time}
          end: {dateTime: "2026-10-23T09:30:00.0000000", timeZone: Pacific Standard Time}
          originalStartTimeZone: Pacific Standard Time
          isAllDay: false
          lastModifiedDateTime: "2026-10-01T12:00:00Z"
        - id: "AAMkEvStandup="
          changeKey: "ck-standup-1"
          iCalUId: "uid-standup"
          type: seriesMaster
          subject: Standup
          start: {dateTime: "2026-10-05T09:00:00.0000000", timeZone: Pacific Standard Time}
          end: {dateTime: "2026-10-05T09:15:00.0000000", timeZone: Pacific Standard Time}
          originalStartTimeZone: Pacific Standard Time
          isAllDay: false
          lastModifiedDateTime: "2026-10-02T12:00:00Z"
          recurrence:
            pattern: {type: weekly, interval: 1, daysOfWeek: [monday], firstDayOfWeek: sunday}
            range: {type: noEnd, startDate: "2026-10-05", recurrenceTimeZone: Pacific Standard Time}
          cancelledOccurrences: ["OID.AAMkEvStandup=.2026-11-02"]
          exceptionOccurrences: []
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft calendar sync complete: 1 calendars", timeout: 90}
  - client.task:
      __cls: SyncbackEventTask
      event_of: "uid-planning|"
      ics_replace: [["SUMMARY:Planning", "SUMMARY:Planning review"]]
    as: refused
  - wait: {task: refused, timeout: 60}
  - client.task:
      __cls: SyncbackEventTask
      event_of: "uid-standup|"
      ics_replace: [["EXDATE;TZID=Pacific Standard Time:20261102T090000\r\n", ""]]
    as: restore
  - wait: {task: restore, timeout: 60}
  - client.task:
      __cls: SyncbackEventTask
      event_of: "uid-sync|"
      ics_replace: [["DESCRIPTION:Join the meeting", "DESCRIPTION:Bring the numbers"]]
    as: notes
  - wait: {task: notes, timeout: 60}
  - client.task:
      __cls: SyncbackEventTask
      event_of: "uid-sync|"
      ics_replace: [["SUMMARY:Weekly sync", "SUMMARY:Weekly sync (Q4)"]]
    as: title
  - wait: {task: title, timeout: 60}
  - server.graph_failures:
      failures:
        - {route: "^calendars/AAMkADefault=/events$", method: POST, status: 400, code: ErrorInvalidRequest, times: 1}
  - client.task:
      __cls: SyncbackEventTask
      calendar_of: Calendar
      event:
        icsuid: "new-event@mailspring"
        ics: "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:new-event@mailspring\r\nSUMMARY:Design review\r\nDTSTART;TZID=America/Chicago:20261021T140000\r\nDTEND;TZID=America/Chicago:20261021T150000\r\nDTSTAMP:20261013T120000Z\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n"
    as: create
  - wait: {task: create, timeout: 60}
expect:
  task_error:
    refused: "Invalid Response Code: 400"
    restore: cannot-restore-occurrence
    notes: online-meeting-notes
    title: null
    create: "Invalid Response Code: 400"
  graph:
    event_writes:
      - [PATCH, "^calendars/AAMkADefault=/events/AAMkEvSync=$", [subject]]
  events:
    "uid-planning|":
      etag: "ck-planning-1"
      ics_has: ["SUMMARY:Planning"]
    "uid-standup|":
      etag: "ck-standup-1"
      ics_has: ["EXDATE;TZID=Pacific Standard Time:20261102T090000"]
    "uid-sync|":
      etag: "ck-sync-1+"
      ics_has: ["SUMMARY:Weekly sync (Q4)", "DESCRIPTION:Join the meeting"]
  running: true
