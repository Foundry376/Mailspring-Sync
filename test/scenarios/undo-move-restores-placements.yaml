name: undo-move-restores-placements
description: >
  A self-addressed message has placements in INBOX and Sent. From the Inbox perspective the
  user archives it: the ChangeFolderTask carries sourceFolderIds = [INBOX], so only the
  INBOX copy moves to Archive and the Sent copy stays. The engine records what it moved as
  undoPlacements on the task during its local phase; the undo task (same message ids,
  restorePlacements = that map, folder = the first recorded source) must move the copy back:
  server and database both show INBOX + Sent again, Archive empty, and nothing flaps.
  Known engine bug on servers without QRESYNC (fake:plain, dovecot:plain): the background
  connection still has Archive selected from the pass that ingested the moved copy, and its
  next new-mail fetch there (`UID FETCH 4:5`, re-issued every pass because the plain path
  only advances LS_UIDNEXT in shallow/deep scans) is answered from that connection's stale
  view, so the Archive copy the undo just moved out is re-added as a placement and only
  deleted a pass later - the engine's own move flaps once. The plan's Phase 5
  end-of-pass `UID FETCH (UID)` verification would catch it.
source: "docs/message-placements-plan.md 3.1 (sourceFolderIds) and 3.3 (engine writes undoPlacements; client copies it to restorePlacements); TaskProcessor.cpp _movesForMessage restorePlacements branch; client change-folder-task.ts createUndoTasks"
servers:
  - {fake: dovecot}
  - {fake: plain}
  - {dovecot: qresync}
  - {dovecot: plain}
mailboxes:
  INBOX: {messages: 8}
  Sent: {messages: 2}
  Archive: {messages: 3}
setup:
  - server.append: {mailbox: INBOX, messages: {count: 2, self_addressed: true}}
  - server.duplicate: {mailbox: INBOX, uids: "9:10", to: Sent}
steps:
  - wait: quiescent
  - snapshot: before
  - client.task: {__cls: ChangeFolderTask, messages: {mailbox: INBOX, uids: [9]}, folder: Archive, sourceFolders: [INBOX]}
    as: archive
  - wait: {task: archive, timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
  - assert:
      server_counts: {INBOX: 9, Sent: 4, Archive: 4}
      counts: {INBOX: 9, Sent: 4, Archive: 4}
      db_matches_server: {}
  - client.undo_task: {of: archive}
    as: undo
  - wait: {task: undo, timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
expect:
  server_counts: {INBOX: 10, Sent: 4, Archive: 3}
  counts: {INBOX: 10, Sent: 4, Archive: 3}
  db_matches_server: {}
  stable: {passes: 2}
  running: true
