name: graph-calendar-event-read-back-fails
description: >
  Graph creates a new event, but reading it back fails. The task still succeeds: Graph holds the
  event, and an error would have the user create it a second time. The client's row takes Graph's
  id with no changeKey, so the next pass reads Graph's copy over it.
source: "MicrosoftCalendarWorker::writeEvent: a write's read-back is a separate GET, after the write has succeeded"
env:
  CALENDAR_SYNC_NOW: 1791936000 # 2026-10-14T00:00Z
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, isDefaultCalendar: true, owner: {name: Harness Test, address: test@example.test}}
    graph_events:
      AAMkADefault=: []
    graph_failures:
      - {route: "^calendars/AAMkADefault=/events/AAMkEvCreated1=$", method: GET, status: 400, code: ErrorInvalidRequest, times: 1}
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft calendar sync complete: 1 calendars", timeout: 90}
  - client.task:
      __cls: SyncbackEventTask
      calendar_of: Calendar
      event:
        icsuid: "new-event@mailspring"
        ics: "BEGIN:VCALENDAR\r\nPRODID:-//Mailspring//Calendar//EN\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:new-event@mailspring\r\nSUMMARY:Design review\r\nDTSTART;TZID=America/Chicago:20261021T140000\r\nDTEND;TZID=America/Chicago:20261021T150000\r\nTRANSP:OPAQUE\r\nDTSTAMP:20261013T120000Z\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n"
    as: create
  - wait: {task: create, timeout: 60}
  - client.sync_calendar: {}
  - wait: {seconds: 3}
expect:
  task_error: {create: null}
  graph:
    event_writes:
      - [POST, "^calendars/AAMkADefault=/events$", [attendees, body, end, isAllDay, isReminderOn, location, recurrence, showAs, start, subject, transactionId]]
  events:
    "uid-created-1|":
      etag: "ck-created-1"
      href: "AAMkEvCreated1="
      ics_has: ["SUMMARY:Design review"]
  log_present: ["Could not read event AAMkEvCreated1= back"]
  log_count: {"Microsoft calendar sync complete": 2}
  running: true
