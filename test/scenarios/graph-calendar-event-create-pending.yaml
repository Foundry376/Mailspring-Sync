name: graph-calendar-event-create-pending
description: >
  A new event waits for its create to reach Graph while the IMAP connection is slow to leave IDLE,
  which every remote phase waits on. Meanwhile the user retitles the event and a calendar pass
  runs. The pass leaves the event's row alone, since it has no Graph id yet, and the create sends
  the row as it stands, retitle included.
source: "TaskProcessor: a remote phase runs at least 300 ms after its local phase, on the foreground worker once it leaves IDLE"
env:
  CALENDAR_SYNC_NOW: 1791936000 # 2026-10-14T00:00Z
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, isDefaultCalendar: true, owner: {name: Harness Test, address: test@example.test}}
    graph_events:
      AAMkADefault=: []
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft calendar sync complete: 1 calendars", timeout: 90}
  - wait: {idle: true, timeout: 60}
  - server.pause: {at: {hook: idle_tick, session: foreground, delay: 6}}
  - client.task:
      __cls: SyncbackEventTask
      id: task-create
      calendar_of: Calendar
      event:
        icsuid: "new-event@mailspring"
        ics: "BEGIN:VCALENDAR\r\nPRODID:-//Mailspring//Calendar//EN\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:new-event@mailspring\r\nSUMMARY:Design review\r\nDTSTART;TZID=America/Chicago:20261021T140000\r\nDTEND;TZID=America/Chicago:20261021T150000\r\nTRANSP:OPAQUE\r\nDTSTAMP:20261013T120000Z\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n"
    as: create
  - wait: {log: "\\[task-create\\] -- Succeeded. Changing status to `remote`", timeout: 10}
  - client.task:
      __cls: SyncbackEventTask
      event_of: "new-event@mailspring|"
      ics_replace: [["SUMMARY:Design review", "SUMMARY:Design review (Q4)"]]
  - client.sync_calendar: {}
  - wait: {seconds: 1}
  - wait: {task: create, timeout: 60}
expect:
  task_error: {create: null}
  graph:
    event_writes:
      - [POST, "^calendars/AAMkADefault=/events$", [attendees, body, end, isAllDay, location, recurrence, showAs, start, subject, transactionId]]
  events:
    "uid-created-1|":
      href: "AAMkEvCreated1="
      ics_has: ["SUMMARY:Design review (Q4)"]
  log_count: {"Microsoft calendar sync complete": 2}
  running: true
