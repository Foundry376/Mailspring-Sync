name: search-remote-fetch-dropped-again
description: >
  The connection drops on the first fetch of one batch and again on the first fetch of the
  next. One reconnect is spent on the first; the second drop fails the search, since the
  budget is one reconnect per search, not per batch.
source: "MailSync/SearchWorker.cpp (fetchCandidates)"
servers:
  - {fake: dovecot}
env:
  SEARCH_FETCH_BATCH_MESSAGES: "1"
mailboxes:
  INBOX: {messages: {count: 2, age_days: 120}}
steps:
  - wait: quiescent
  - server.drop_connections: {at: {hook: before_command, command: "^UID FETCH 1 BODY"}}
  - server.drop_connections: {at: {hook: before_command, command: "^UID FETCH 2 BODY"}}
  - client.search: {criteria: [subject, Message], fetchLimit: 100}
    as: fetch
  - wait: {log: 'Search search-\S+ failed: .*ErrorConnection', timeout: 30}
expect:
  search:
    fetch: {error: ErrorConnection}
  log_count:
    'Search search-\S+: connection lost fetching from INBOX, reconnecting': 1
    'Search search-\S+: fetched 1 message\(s\)': 1
  running: true
