name: graph-send-token-expires-mid-send
description: >
  The Graph access token has 62 s of life when the send starts, which leaves the engine 2 s
  before it treats the token as expiring (it refreshes one a minute before expiry), and Graph
  throttles the attachment upload for 3 s. Each request must take the token for it from the
  token manager, so /send goes out with a refreshed token rather than the one the send started
  with - on a slow upload of large attachments that one has expired.
source: "Pre-release audit of the Graph send path, 2026-10-23: one token was used for the whole send"
servers:
  - fake: outlook
    smtp: true
    graph: true
    graph_token_lifetime: 62
    graph_failures:
      - {route: "/attachments$", method: POST, status: 429, code: TooManyRequests, times: 1, retry_after: 3}
mailboxes:
  INBOX: {messages: 2}
steps:
  - wait: quiescent
  - client.task:
      __cls: SendDraftTask
      draft:
        hMsgId: "graph-token@example.test"
        subject: "Slow upload"
        body: "<p>Hi Bob</p>"
        plaintext: false
        from: [{name: "Harness Test", email: "test@example.test"}]
        to: [{name: "Bob Builder", email: "bob@example.net"}]
        cc: []
        bcc: []
        replyTo: []
        rthMsgId: ""
        fwdMsgId: ""
        files:
          - {filename: "big.bin", bytes: 2900000}
      perRecipientBodies: null
    as: send1
  - wait: {task: send1, timeout: 90}
  - wait: {quiescent: true}
expect:
  task_error: {send1: null}
  graph: {count: 1, drafts: 0, distinct_tokens: ["/messages$", "/send$"], messages: [{attachments: ["big.bin"]}]}
  server_counts: {Sent Items: 1}
  log_present: ["Graph returned 429, retrying in 3s"]
  running: true
