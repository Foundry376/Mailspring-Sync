name: plain-expunge-found-by-deep-scan
description: >
  On a server without CONDSTORE/QRESYNC there is no VANISHED; a remote expunge is only
  discovered by the periodic deep scan comparing local UIDs against the server's. The scan
  interval is 10 minutes, so the harness backdates lastDeep and wakes the worker.

  Dovecot answers a FETCH from the connection's stale view when the folder was already
  selected - the expunged messages are still listed and the EXPUNGE lines follow the data
  (conformance: probe_stale_fetch) - so the engine NOOPs the background connection before a
  scan of an already-selected folder (5080fb2). One scan must be enough.
source: SyncWorker.cpp deep-scan branch; PR #140 control run; 5080fb2
servers:
  - {fake: plain}
  - {dovecot: plain}
mailboxes:
  INBOX: {messages: 200}
  Archive: {messages: 20}
steps:
  - wait: quiescent
  - server.expunge: {mailbox: INBOX, uids: "50:60"}
  - server.expunge: {mailbox: Archive, uids: [3]}
  - force_scans: {}
expect:
  db_matches_server: {}
  counts: {INBOX: 189, Archive: 19}
  running: true
