name: graph-calendar-event-delete
description: >
  Deleting an Outlook series DELETEs its master, and every row of the series goes: the master's
  and its override's. An override row is never deleted on its own, since it carries its series'
  id. An edit to an event already gone from Graph (404) fails as not-found and leaves its row to
  the next pass, without the etag it had; deleting that event finds it gone (404) and drops the row
  without an error.
source: "https://learn.microsoft.com/en-us/graph/api/event-delete"
env:
  CALENDAR_SYNC_NOW: 1791936000 # 2026-10-14T00:00Z
servers:
  - fake: outlook
    graph: true
    graph_send: false
    graph_consented: false
    graph_calendars:
      - {id: "AAMkADefault=", name: Calendar, isDefaultCalendar: true, owner: {name: Harness Test, address: test@example.test}}
    graph_events:
      AAMkADefault=:
        - id: "AAMkEvRetro="
          changeKey: "ck-retro-1"
          iCalUId: "uid-retro"
          type: singleInstance
          subject: Retro
          start: {dateTime: "2026-10-23T15:00:00.0000000", timeZone: Pacific Standard Time}
          end: {dateTime: "2026-10-23T16:00:00.0000000", timeZone: Pacific Standard Time}
          originalStartTimeZone: Pacific Standard Time
          isAllDay: false
          lastModifiedDateTime: "2026-10-01T12:00:00Z"
        - id: "AAMkEvStandup="
          changeKey: "ck-standup-1"
          iCalUId: "uid-standup"
          type: seriesMaster
          subject: Standup
          start: {dateTime: "2026-10-05T09:00:00.0000000", timeZone: Pacific Standard Time}
          end: {dateTime: "2026-10-05T09:15:00.0000000", timeZone: Pacific Standard Time}
          originalStartTimeZone: Pacific Standard Time
          isAllDay: false
          lastModifiedDateTime: "2026-10-02T12:00:00Z"
          recurrence:
            pattern: {type: weekly, interval: 1, daysOfWeek: [monday], firstDayOfWeek: sunday}
            range: {type: noEnd, startDate: "2026-10-05", recurrenceTimeZone: Pacific Standard Time}
          cancelledOccurrences: []
          exceptionOccurrences:
            - id: "AAMkEvStandupX1="
              type: exception
              iCalUId: "uid-standup-x1"
              subject: Standup (moved)
              originalStart: "2026-10-19T16:00:00Z"
              start: {dateTime: "2026-10-19T10:00:00.0000000", timeZone: Pacific Standard Time}
              end: {dateTime: "2026-10-19T10:15:00.0000000", timeZone: Pacific Standard Time}
              isAllDay: false
              lastModifiedDateTime: "2026-10-02T12:00:00Z"
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: {log: "Microsoft calendar sync complete: 1 calendars", timeout: 90}
  - client.task: {__cls: DestroyEventTask, events_of: ["uid-standup|20261019T160000Z"]}
    as: override
  - wait: {task: override, timeout: 60}
  - client.task: {__cls: DestroyEventTask, events_of: ["uid-standup|"]}
    as: series
  - wait: {task: series, timeout: 60}
  - server.graph_events: {calendar: "AAMkADefault=", events: []}
  - client.task:
      __cls: SyncbackEventTask
      event_of: "uid-retro|"
      ics_replace: [["SUMMARY:Retro", "SUMMARY:Retro (Q4)"]]
    as: edit_gone
  - wait: {task: edit_gone, timeout: 60}
  - assert:
      events:
        "uid-retro|": {etag: ""}
  - client.task: {__cls: DestroyEventTask, events_of: ["uid-retro|"]}
    as: gone
  - wait: {task: gone, timeout: 60}
expect:
  task_error: {override: shared-resource, series: null, edit_gone: not-found, gone: null}
  graph:
    event_writes:
      - [DELETE, "^calendars/AAMkADefault=/events/AAMkEvStandup=$", []]
  events: {}
  running: true
