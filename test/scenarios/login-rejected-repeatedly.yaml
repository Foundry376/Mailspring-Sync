name: login-rejected-repeatedly
description: >
  After a reconnect the server rejects every login. The engine retries twice (after 30 s,
  then 2 min) and exits on the third rejection so the client can decide whether to relaunch
  it or mark the account as needing re-authentication. A wake cuts a wait short and retries
  at once, but a rejection on that retry does not use up an attempt: the client wakes every
  account on resume, on the `online` event and when another account reconnects.
source: community.getmailspring.com/t/14606
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: 5}
steps:
  - wait: quiescent
  - server.reject: {at: {hook: before_command, command: "^LOGIN", every: true}, text: "AUTHENTICATE failed."}
  - server.drop_connections: {}
  - client.wake: {}
  - wait: {log: "^--sleeping 30s before retrying login"}
  - client.wake: {}
  - wait: {seconds: 5}
  - assert: {log_absent: ["^--sleeping 120s before retrying login"], running: true}
  - wait: {log: "^--sleeping 120s before retrying login", timeout: 60}
  - wait: {seconds: 125}
expect:
  exit: {code: null}
