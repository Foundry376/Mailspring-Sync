name: search-remote-fetch-refused
description: >
  The server refuses a body fetch with NO. The folder is recorded in `errors`, and the batch
  is fetched again one message at a time on a fresh connection, the search's one reconnect,
  so every candidate is still stored when the refusal was one-off.
source: "MailSync/SearchWorker.cpp (fetchCandidates)"
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: {count: 3, age_days: 120}}
steps:
  - wait: quiescent
  - server.reject: {at: {hook: before_command, command: "^UID FETCH [0-9:,]+ BODY\\.PEEK"}, code: SERVERBUG, text: "Fetch failed"}
  - client.search: {criteria: [subject, Message], fetchLimit: 100}
    as: fetch
  - wait: {log: 'Search search-\S+: fetched 3 message\(s\) .* 3 of 3 stored', timeout: 30}
expect:
  search:
    fetch: {candidates: 3, fetched: 3, skipped: 0, phase: done, folder_errors: 1}
  log_present:
    - 'Search search-\S+: fetching 3 message\(s\) from INBOX failed'
    - 'Search search-\S+: retrying 3 message\(s\) from INBOX one at a time on a fresh connection'
  running: true
