name: search-remote-badcharset
description: >
  Exchange Online refuses SEARCH CHARSET utf-8 with NO [BADCHARSET (US-ASCII)] (an
  outlook.office365.com transcript in php-imap#128, 2016-05-23; no UTF8=ACCEPT in 2026
  captures either). CHARSET is only sent when a term is non-ASCII (libetpan
  mailimap_search_key_need_to_send_charset; Thunderbird and Evolution do the same), so an
  ASCII search runs, and a non-ASCII one fails in every folder and the client keeps its
  local results.
source: "Vendor/libetpan mailimap_sender.c; RFC 3501 6.4.4 (BADCHARSET)"
servers:
  - {fake: outlook}
setup:
  - server.append: {mailbox: INBOX, messages: {subject: "=?UTF-8?Q?Caf=C3=A9_plans?=", body: "Dessert will be crème brûlée.", transfer_encoding: quoted-printable, message_id: "<cafe@search.test>"}}
  - server.append: {mailbox: INBOX, messages: {subject: Plain coffee, body: "Coffee only.", message_id: "<plain@search.test>"}}
steps:
  - wait: quiescent
  - client.search: {criteria: [text, brûlée]}
    as: body_utf8
  - client.search: {criteria: [subject, coffee]}
    as: ascii
expect:
  search:
    body_utf8: {message_ids: [], folder_errors: 4}
    ascii: {message_ids: ["<plain@search.test>"], folder_errors: 0}
  log_present:
    - '(?i)UID SEARCH CHARSET UTF-8 TEXT'
    - 'BADCHARSET'
  log_absent:
    - '(?i)UID SEARCH CHARSET UTF-8 SUBJECT'
  running: true
