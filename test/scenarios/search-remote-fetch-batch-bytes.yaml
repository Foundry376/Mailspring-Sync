name: search-remote-fetch-batch-bytes
description: >
  A batch also closes on bytes: with the batch limit held to 600 bytes and messages of
  about 400, each of three candidates goes in its own UID FETCH.
source: "MailSync/SearchWorker.cpp (fetchCandidates)"
servers:
  - {fake: dovecot}
env:
  SEARCH_FETCH_BATCH_BYTES: "600"
mailboxes:
  INBOX: {messages: {count: 3, age_days: 120}}
steps:
  - wait: quiescent
  - client.search: {criteria: [subject, Message], fetchLimit: 100}
    as: fetch
  - wait: {log: 'Search search-\S+: fetched 1 message\(s\) .* 3 of 3 stored', timeout: 30}
expect:
  search:
    fetch: {candidates: 3, fetched: 3, skipped: 0, phase: done, fetch_events: {min: 1}}
  log_count:
    'sent \d+ UID FETCH [0-9]+ BODY\.PEEK\[\]': 3
  running: true
