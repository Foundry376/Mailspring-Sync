name: move-with-permuted-copyuid
description: >
  Yahoo answers a multi-message UID MOVE with a COPYUID whose ascending destination range is
  not the order it assigned the UIDs in. The engine must record each moved copy at the UID
  that really holds it, so that moving one of them again moves that message on the server,
  and no scan has to take a UID back from the wrong message. yahoo-without-move covers the
  COPY + EXPUNGE path; Dovecot is the control with a correct COPYUID.
source: client docs/evidence/yahoo-copyuid (observed 2026-09-24); RFC 4315 §3
servers:
  - {fake: yahoo}
  - {fake: yahoo-without-move}
  - {dovecot: qresync}
mailboxes:
  INBOX: {messages: 10}
  Archive: {messages: 2}
steps:
  - wait: quiescent
  - client.task: {__cls: ChangeFolderTask, messages: {mailbox: INBOX, uids: [2, 3, 4, 5, 6]}, folder: Archive}
    as: archive
  - wait: {task: archive, timeout: 60}
  - assert: {db_matches_server: {}}
  # "Message 3", by Message-ID so the selection does not depend on the engine's UIDs.
  - client.task: {__cls: ChangeFolderTask, messages: {header_message_ids: ["<harness-3-e480dd9e@example.test>"]}, folder: INBOX}
    as: restore
  - wait: {task: restore, timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
expect:
  server_has: {INBOX: ["<harness-3-e480dd9e@example.test>"]}
  server_counts: {INBOX: 6, Archive: 6}
  db_matches_server: {}
  log_absent: ["lost a placement to another message"]
  stable: {passes: 1}
  running: true
