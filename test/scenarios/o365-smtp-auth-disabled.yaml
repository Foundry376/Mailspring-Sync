name: o365-smtp-auth-disabled
description: >
  Exchange Online refuses SMTP AUTH for the tenant (535 5.7.139). An Office 365 account still
  sending over SMTP must fail with smtp-auth-disabled, which the client answers by asking the
  user to reconnect the account so it sends through Graph instead.
source: "https://aka.ms/smtp_auth_disabled"
servers:
  - fake: outlook
    smtp: true
    graph: true
    graph_send: false
    smtp_auth_response: "535 5.7.139 Authentication unsuccessful, SmtpClientAuthentication is disabled for the Tenant. Visit https://aka.ms/smtp_auth_disabled for more information."
mailboxes:
  INBOX: {messages: 2}
steps:
  - wait: quiescent
  - client.task:
      __cls: SendDraftTask
      draft:
        hMsgId: "smtp-disabled@example.test"
        subject: "Blocked"
        body: "<p>Hi Bob</p>"
        plaintext: false
        from: [{name: "Harness Test", email: "test@example.test"}]
        to: [{name: "Bob Builder", email: "bob@example.net"}]
        cc: []
        bcc: []
        replyTo: []
        rthMsgId: ""
        fwdMsgId: ""
        files: []
      perRecipientBodies: null
    as: send1
  - wait: {task: send1, timeout: 60}
  - wait: {quiescent: true}
expect:
  task_error: {send1: smtp-auth-disabled}
  smtp: {count: 0}
  graph: {count: 0, graph_mail_token_requests: 0}
  server_counts: {Sent Items: 0}
  db_matches_server: {}
  running: true
