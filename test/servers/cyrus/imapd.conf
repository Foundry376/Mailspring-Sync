# Cyrus IMAP 3.6 for the mailsync integration harness; see harness/servers/cyrus.py.
configdirectory: /var/lib/cyrus
defaultpartition: default
partition-default: /var/spool/cyrus/mail
proc_path: /run/cyrus/proc
mboxname_lockpath: /run/cyrus/lock
idlesocket: /run/cyrus/socket/idle
notifysocket: /run/cyrus/socket/notify
lmtpsocket: /run/cyrus/socket/lmtp
hashimapspool: true
admins: cyrus

# Fastmail's namespace: personal folders at the top level ("Sent", not "INBOX.Sent") with
# "/" as the separator, i.e. NAMESPACE (("" "/")) - upstream's 3.x default, which Debian
# turns off. The harness's default-ns profile restores Debian's INBOX-rooted "." layout.
altnamespace: yes
unixhierarchysep: yes

allowplaintext: yes
sasl_mech_list: PLAIN LOGIN
sasl_pwcheck_method: auxprop
sasl_auxprop_plugin: sasldb
sasl_sasldb_path: /etc/sasldb2

# Fastmail runs delayed expunge: EXPUNGE hides messages from IMAP but keeps them in the
# index until cyr_expire, which is what makes QRESYNC VANISHED (EARLIER) exact.
expunge_mode: delayed
delete_mode: delayed

# IDLE is pushed by idled (START below); imapidlepoll is the fallback poll interval.
imapidlepoll: 1
